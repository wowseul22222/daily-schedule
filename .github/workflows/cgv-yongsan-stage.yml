name: CGV Yongsan Stage Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-stage-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify stage source
        shell: bash
        run: |
          python -m py_compile cgv_yongsan_stage.py
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("cgv_yongsan_stage.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'CGV_STAGE_CODE = "0025"',
              'TARGET_WEEKDAYS = {2, 5, 6}',
              'TARGET_DAY_LABEL = "수/토/일/공휴일"',
              'FULL_SCAN_INTERVAL = 120.0',
              'FAST_SCAN_START_OFFSET = 7',
              'def make_dates(start_offset=7, end_offset=42):',
              'KOREA_PUBLIC_HOLIDAYS = {',
              'RUN_SECONDS',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ 무대인사 소스 검증 실패:", ", ".join(missing))
              sys.exit(1)
          print("✅ CGV 용산 무대인사 소스 검증 통과")
          PY

      - name: Check secrets
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          test -n "$CGV_CUST_NO" || { echo "❌ CGV_CUST_NO secret missing"; exit 1; }
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ CGV/Discord secrets loaded"

      - name: Set manual monitoring duration
        id: duration
        shell: bash
        run: |
          # 수동 실행 1회당 최대 5시간 30분 감시.
          # Python 자체 운영시간 가드(06:00~24:00)가 자정에는 먼저 종료시킨다.
          echo "seconds=19800" >> "$GITHUB_OUTPUT"

      - name: Run stage monitor
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: |
          echo "✅ STAGE RUN_SECONDS=${RUN_SECONDS}"
          python -u cgv_yongsan_stage.py

      - name: Save stage state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_stage_v4.json \
            baseline_cgv_yongsan_stage_v4.done \
            cgv_yongsan_stage_booking_state_v4.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No stage state changes"
          else
            git commit -m "Update CGV Yongsan stage state v4"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
