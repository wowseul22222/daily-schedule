name: CGV Yongsan Stage Monitor

on:
  workflow_dispatch:
  schedule:
    # KST 06:03
    - cron: "3 21 * * *"
    # KST 11:33
    - cron: "33 2 * * *"
    # KST 17:03
    - cron: "3 8 * * *"
    # KST 22:33
    - cron: "33 13 * * *"

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-stage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify stage source
        shell: bash
        run: |
          python -m py_compile cgv_yongsan_stage.py
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("cgv_yongsan_stage.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'CGV_STAGE_CODE = "0025"',
              'TARGET_WEEKDAYS = {2, 5, 6}',
              'TARGET_DAY_LABEL = "수/토/일/공휴일"',
              'FULL_SCAN_INTERVAL = 120.0',
              'RUN_SECONDS',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ 무대인사 소스 검증 실패:", ", ".join(missing))
              sys.exit(1)
          print("✅ CGV 용산 무대인사 소스 검증 통과")
          PY

      - name: Check secrets
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          test -n "$CGV_CUST_NO" || { echo "❌ CGV_CUST_NO secret missing"; exit 1; }
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ CGV/Discord secrets loaded"

      - name: Set monitoring duration
        id: duration
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("CRON_SCHEDULE", "")
          now = datetime.now(ZoneInfo("Asia/Seoul"))

          next_times = {
              "3 21 * * *": (11, 33),
              "33 2 * * *": (17, 3),
              "3 8 * * *": (22, 33),
              "33 13 * * *": (0, 0),
          }

          def seconds_until(hour, minute, next_day=False):
              if next_day:
                  target = (now + timedelta(days=1)).replace(
                      hour=hour, minute=minute, second=0, microsecond=0
                  )
              else:
                  target = now.replace(
                      hour=hour, minute=minute, second=0, microsecond=0
                  )
                  if target <= now:
                      target += timedelta(days=1)

              return max(60, int((target - now).total_seconds()) - 60)

          if event_name == "schedule":
              hour, minute = next_times.get(schedule, (0, 0))
              if schedule == "33 13 * * *":
                  print(f"seconds={seconds_until(0, 0, next_day=True)}")
              elif schedule in next_times:
                  print(f"seconds={seconds_until(hour, minute)}")
              else:
                  print("seconds=600")
              raise SystemExit

          h, m = now.hour, now.minute
          if (h, m) < (6, 3):
              target = now.replace(hour=6, minute=3, second=0, microsecond=0)
          elif (h, m) < (11, 33):
              target = now.replace(hour=11, minute=33, second=0, microsecond=0)
          elif (h, m) < (17, 3):
              target = now.replace(hour=17, minute=3, second=0, microsecond=0)
          elif (h, m) < (22, 33):
              target = now.replace(hour=22, minute=33, second=0, microsecond=0)
          else:
              target = (now + timedelta(days=1)).replace(
                  hour=0, minute=0, second=0, microsecond=0
              )

          print(f"seconds={max(60, int((target-now).total_seconds())-60)}")
          PY

      - name: Run stage monitor
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: |
          echo "✅ STAGE RUN_SECONDS=${RUN_SECONDS}"
          python -u cgv_yongsan_stage.py

      - name: Save stage state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_stage_v4.json \
            baseline_cgv_yongsan_stage_v4.done \
            cgv_yongsan_stage_booking_state_v4.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No stage state changes"
          else
            git commit -m "Update CGV Yongsan stage state v4"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
