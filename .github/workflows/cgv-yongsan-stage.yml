name: CGV Yongsan Stage Monitor

on:
  workflow_dispatch:
  schedule:
    # KST 08:05
    - cron: "5 23 * * *"
    # KST 13:35
    - cron: "35 4 * * *"
    # KST 19:05
    - cron: "5 10 * * *"
    # KST 23:35
    - cron: "35 14 * * *"

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-stage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify stage source
        shell: bash
        run: |
          python -m py_compile cgv_yongsan_stage.py
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("cgv_yongsan_stage.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'CGV_STAGE_CODE = "0025"',
              'TARGET_WEEKDAYS = {2, 5, 6}',
              'TARGET_DAY_LABEL = "수/토/일/공휴일"',
              'FULL_SCAN_INTERVAL = 120.0',
              'STATE_FILE = "seen_cgv_yongsan_stage_v4.json"',
              'BOOKING_STATE_FILE = "cgv_yongsan_stage_booking_state_v4.json"',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ 무대인사 소스 검증 실패:", ", ".join(missing))
              sys.exit(1)
          print("✅ CGV 용산 무대인사 소스 검증 통과")
          PY

      - name: Check secrets
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          test -n "$CGV_CUST_NO" || { echo "❌ CGV_CUST_NO secret missing"; exit 1; }
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ CGV/Discord secrets loaded"

      - name: Set monitoring duration
        id: duration
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Seoul"))
          cutoffs = [(8, 4), (13, 34), (19, 4), (23, 34), (23, 59)]
          target = None
          for h, m in cutoffs:
              candidate = now.replace(hour=h, minute=m, second=0, microsecond=0)
              if candidate > now:
                  target = candidate
                  break

          if not (8 <= now.hour <= 23) or target is None:
              seconds = 60
          else:
              seconds = max(60, int((target - now).total_seconds()))

          print(f"seconds={seconds}")
          PY

      - name: Run stage monitor
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        shell: bash
        run: |
          echo "✅ STAGE RUN_SECONDS=${RUN_SECONDS}"
          python -u cgv_yongsan_stage.py

      - name: Save stage state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_stage_v4.json \
            baseline_cgv_yongsan_stage_v4.done \
            cgv_yongsan_stage_booking_state_v4.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No stage state changes"
            exit 0
          fi

          git commit -m "Update CGV Yongsan stage state v4"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
