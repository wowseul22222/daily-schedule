name: CGV Yongsan Stage Monitor

on:
  workflow_dispatch:
  schedule:
    # 첫 시작 KST 08:45
    - cron: "45 8 * * *"
      timezone: "Asia/Seoul"
    # 이후 30분마다 watchdog. 앞 실행이 살아 있으면 concurrency에서 대기.
    - cron: "15,45 9-22 * * *"
      timezone: "Asia/Seoul"
    # 자정 전 마지막 watchdog
    - cron: "15 23 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

# 같은 모니터가 겹쳐서 중복 알림을 내지 않게 한 번에 하나만 실행.
# 30분 watchdog이 대기 중이면 현재 실행 종료 후 이어서 시작한다.
concurrency:
  group: cgv-yongsan-stage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger info
        shell: bash
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "SCHEDULE=${{ github.event.schedule }}"
          echo "REF=${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify source
        shell: bash
        run: |
          python -m py_compile cgv_yongsan_stage.py
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("cgv_yongsan_stage.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'CGV_STAGE_CODE = "0025"',
              'TARGET_WEEKDAYS = {2, 5, 6}',
              'TARGET_DAY_LABEL = "수/토/일/공휴일"',
              'FULL_SCAN_INTERVAL = 120.0',
              'RUN_SECONDS'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ source verification failed:", ", ".join(missing))
              sys.exit(1)
          print("✅ source verification passed")
          PY

      - name: Check secrets
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          test -n "$CGV_CUST_NO" || { echo "❌ CGV_CUST_NO secret missing"; exit 1; }
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ secrets loaded"

      - name: Set monitoring duration
        id: duration
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Seoul"))
          midnight = now.replace(hour=23, minute=59, second=0, microsecond=0)

          # 한 실행은 최대 65분.
          # 30분 watchdog이 계속 생성되므로 현재 실행이 끝날 때
          # 가장 최근 대기 실행이 이어받는다.
          max_seconds = 3900

          if now >= midnight:
              seconds = 120
          else:
              seconds = min(max_seconds, max(120, int((midnight - now).total_seconds())))

          print(f"seconds={seconds}")
          print(f"RUN_SECONDS={seconds}", file=__import__("sys").stderr)
          PY

      - name: Run monitor
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        shell: bash
        run: |
          echo "✅ STAGE RUN_SECONDS=${RUN_SECONDS}"
          python -u cgv_yongsan_stage.py

      - name: Save state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_stage_v4.json \
            baseline_cgv_yongsan_stage_v4.done \
            cgv_yongsan_stage_booking_state_v4.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "Update CGV Yongsan stage state"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
