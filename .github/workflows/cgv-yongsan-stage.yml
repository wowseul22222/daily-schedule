name: CGV Yongsan Stage Monitor

on:
  workflow_dispatch:
  schedule:
    # KST 08:45
    - cron: "45 23 * * *"
    # KST 12:45
    - cron: "45 3 * * *"
    # KST 16:45
    - cron: "45 7 * * *"
    # KST 20:45
    - cron: "45 11 * * *"

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-stage-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify source
        run: |
          python -m py_compile cgv_yongsan_stage.py
          python - <<'PY'
          from pathlib import Path
          import sys
          text = Path("cgv_yongsan_stage.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'CGV_STAGE_CODE = "0025"',
              'TARGET_WEEKDAYS = {2, 5, 6}',
              'TARGET_DAY_LABEL = "수/토/일/공휴일"',
              'CGV_CUST_NO',
              'CY_WEBHOOK',
              'DISCORD_MENTION_ID',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ 무대인사 소스 검증 실패:", ", ".join(missing))
              sys.exit(1)
          print("✅ CGV 용산 무대인사 소스 검증 통과")
          PY

      - name: Check secrets
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        run: |
          test -n "$CGV_CUST_NO" || { echo "❌ CGV_CUST_NO secret missing"; exit 1; }
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ CGV/Discord secrets loaded"

      - name: Set monitoring duration
        id: duration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=120" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "45 23 * * *"|"45 3 * * *"|"45 7 * * *")
                echo "seconds=14340" >> "$GITHUB_OUTPUT"
                ;;
              "45 11 * * *")
                echo "seconds=11640" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "seconds=120" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Run stage monitor
        env:
          CGV_CUST_NO: ${{ secrets.CGV_CUST_NO }}
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: python -u cgv_yongsan_stage.py

      - name: Save stage state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_stage_v4.json \
            baseline_cgv_yongsan_stage_v4.done \
            cgv_yongsan_stage_booking_state_v4.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No stage state changes"
            exit 0
          fi

          git commit -m "Update CGV Yongsan stage state v4"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
