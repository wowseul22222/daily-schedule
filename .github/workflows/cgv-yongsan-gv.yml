name: CGV Yongsan GV Monitor

on:
  workflow_dispatch:
  schedule:
    # KST 08:02
    - cron: "2 23 * * *"
    # KST 13:32
    - cron: "32 4 * * *"
    # KST 19:02
    - cron: "2 10 * * *"
    # KST 23:32
    - cron: "32 14 * * *"

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-gv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify GV source
        shell: bash
        run: |
          python -m py_compile cinema_alert.py
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("cinema_alert.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'GV_CODE = "0023"',
              'CGV YONGSAN GV-ONLY MONITOR',
              'STATE_FILE = "seen_cgv_yongsan_gv_v2.json"',
              'BOOKING_STATE_FILE = "cgv_yongsan_gv_booking_state_v2.json"',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ GV 소스 검증 실패:", ", ".join(missing))
              sys.exit(1)
          print("✅ CGV 용산 GV 소스 검증 통과")
          PY

      - name: Check secrets
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ Discord secrets loaded"

      - name: Set monitoring duration
        id: duration
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Seoul"))

          # 잘됐던 시절 방식: 소수의 긴 실행 구간만 사용하고 서로 겹치지 않는다.
          # 실제 시작이 지연돼도 '다음 정규 실행 1분 전'까지만 돌아서 밀림을 누적하지 않는다.
          cutoffs = [(8, 1), (13, 31), (19, 1), (23, 31), (23, 59)]
          target = None
          for h, m in cutoffs:
              candidate = now.replace(hour=h, minute=m, second=0, microsecond=0)
              if candidate > now:
                  target = candidate
                  break

          if not (8 <= now.hour <= 23) or target is None:
              seconds = 60
          else:
              seconds = max(60, int((target - now).total_seconds()))

          print(f"seconds={seconds}")
          PY

      - name: Run GV monitor
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        shell: bash
        run: |
          echo "✅ GV RUN_SECONDS=${RUN_SECONDS}"
          python -u cinema_alert.py

      - name: Save GV state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_gv_v2.json \
            baseline_cgv_yongsan_gv_v2.done \
            cgv_yongsan_gv_booking_state_v2.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No GV state changes"
            exit 0
          fi

          git commit -m "Update CGV Yongsan GV state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
