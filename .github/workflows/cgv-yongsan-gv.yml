name: CGV Yongsan GV Monitor

on:
  workflow_dispatch:
  schedule:
    # KST 08:40 / 12:40 / 16:40 / 20:40
    - cron: "40 8 * * *"
      timezone: "Asia/Seoul"
    - cron: "40 12 * * *"
      timezone: "Asia/Seoul"
    - cron: "40 16 * * *"
      timezone: "Asia/Seoul"
    - cron: "40 20 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-gv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify GV source
        shell: bash
        run: |
          python -m py_compile cinema_alert.py
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("cinema_alert.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'GV_CODE = "0023"',
              'CGV YONGSAN GV-ONLY MONITOR',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ GV 소스 검증 실패:", ", ".join(missing))
              sys.exit(1)
          print("✅ CGV 용산 GV 소스 검증 통과")
          PY

      - name: Check secrets
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ Discord secrets loaded"

      - name: Set run duration
        id: duration
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          KST = ZoneInfo("Asia/Seoul")
          now = datetime.now(KST)

          # 각 실행은 다음 구간 직전까지 유지.
          # 수동 실행도 다음 경계까지만 돌아서 다음 자동 실행과 겹치지 않게 한다.
          cutoffs = [(12, 39), (16, 39), (20, 39), (23, 59)]

          target = None
          for hour, minute in cutoffs:
              candidate = now.replace(hour=hour, minute=minute, second=0, microsecond=0)
              if candidate > now:
                  target = candidate
                  break

          if target is None:
              # 밤 23:59 이후 수동 실행 시에는 짧은 확인만 한다.
              seconds = 120
          else:
              seconds = max(120, int((target - now).total_seconds()))

          print(f"seconds={seconds}")
          PY

      - name: Run GV monitor
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          set +e
          timeout --signal=INT "${{ steps.duration.outputs.seconds }}s" \
            python -u cinema_alert.py
          rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || [ "$rc" -eq 130 ]; then
            exit 0
          fi
          exit "$rc"

      - name: Save GV state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_gv_v2.json \
            baseline_cgv_yongsan_gv_v2.done \
            cgv_yongsan_gv_booking_state_v2.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No GV state changes"
            exit 0
          fi

          git commit -m "Update CGV Yongsan GV state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
