name: CGV Yongsan GV Monitor

on:
  workflow_dispatch:
  schedule:
    # KST 06:02
    - cron: "2 21 * * *"
    # KST 11:32
    - cron: "32 2 * * *"
    # KST 17:02
    - cron: "2 8 * * *"
    # KST 22:32
    - cron: "32 13 * * *"

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-gv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verify GV source
        shell: bash
        run: |
          python -m py_compile cinema_alert.py
          python - <<'PY'
          from pathlib import Path
          import sys

          text = Path("cinema_alert.py").read_text(encoding="utf-8")
          required = [
              'SITE_NO = "0013"',
              'GV_CODE = "0023"',
              'CGV YONGSAN GV-ONLY MONITOR',
              'RUN_SECONDS',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              print("❌ GV 소스 검증 실패:", ", ".join(missing))
              sys.exit(1)
          print("✅ CGV 용산 GV 소스 검증 통과")
          PY

      - name: Check secrets
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
        shell: bash
        run: |
          test -n "$CY_WEBHOOK" || { echo "❌ CY_WEBHOOK secret missing"; exit 1; }
          test -n "$DISCORD_MENTION_ID" || { echo "❌ DISCORD_MENTION_ID secret missing"; exit 1; }
          echo "✅ Discord secrets loaded"

      - name: Set monitoring duration
        id: duration
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("CRON_SCHEDULE", "")
          now = datetime.now(ZoneInfo("Asia/Seoul"))

          next_times = {
              "2 21 * * *": (11, 32),
              "32 2 * * *": (17, 2),
              "2 8 * * *": (22, 32),
              "32 13 * * *": (0, 0),
          }

          def seconds_until(hour, minute, next_day=False):
              if next_day:
                  target = (now + timedelta(days=1)).replace(
                      hour=hour, minute=minute, second=0, microsecond=0
                  )
              else:
                  target = now.replace(
                      hour=hour, minute=minute, second=0, microsecond=0
                  )
                  if target <= now:
                      target += timedelta(days=1)

              # 다음 실행 1분 전에 끝내서 queue 누적을 막는다.
              return max(60, int((target - now).total_seconds()) - 60)

          if event_name == "schedule":
              hour, minute = next_times.get(schedule, (0, 0))
              if schedule == "32 13 * * *":
                  print(f"seconds={seconds_until(0, 0, next_day=True)}")
              elif schedule in next_times:
                  print(f"seconds={seconds_until(hour, minute)}")
              else:
                  print("seconds=600")
              raise SystemExit

          # 수동 실행도 현재 시각부터 다음 정규 실행 1분 전까지 감시.
          h, m = now.hour, now.minute
          if (h, m) < (6, 2):
              target = now.replace(hour=6, minute=2, second=0, microsecond=0)
          elif (h, m) < (11, 32):
              target = now.replace(hour=11, minute=32, second=0, microsecond=0)
          elif (h, m) < (17, 2):
              target = now.replace(hour=17, minute=2, second=0, microsecond=0)
          elif (h, m) < (22, 32):
              target = now.replace(hour=22, minute=32, second=0, microsecond=0)
          else:
              target = (now + timedelta(days=1)).replace(
                  hour=0, minute=0, second=0, microsecond=0
              )

          print(f"seconds={max(60, int((target-now).total_seconds())-60)}")
          PY

      - name: Run GV monitor
        env:
          CY_WEBHOOK: ${{ secrets.CY_WEBHOOK }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          RUN_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: |
          echo "✅ GV RUN_SECONDS=${RUN_SECONDS}"
          python -u cinema_alert.py

      - name: Save GV state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen_cgv_yongsan_gv_v2.json \
            baseline_cgv_yongsan_gv_v2.done \
            cgv_yongsan_gv_booking_state_v2.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No GV state changes"
          else
            git commit -m "Update CGV Yongsan GV state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
